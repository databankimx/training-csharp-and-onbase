<body>
    <form method="post" action="#">
        <div id="ping">
            Test Web Service Ping() Method:<br />
            <input type="button" name="btnPing" id="btnPing" value="Ping Service" />
        </div>
        <div id="testService">
            Test Web Service TestService() Method:<br />
            <label for="testData">Test Data:</label> <input type="text" name="testData" id="testData" value="My test data..." />
            <input type="button" name="btnTestService" id="btnTestService" value="Test Service" />
        </div>
        <div id="lookupLocation">
            Test Web Service LookupLocation() Method:<br />
            <label for="zipCode">Test Data:</label> <input type="text" name="zipCode" id="zipCode" value="75067" maxlength="5" />
            <input type="button" name="btnLookupLocation" id="btnLookupLocation" value="Lookup Location" />
        </div>
        <div id="resultDiv">
            <label for="requestJson">Request:</label><br />
            <textarea name="requestJson" id="requestJson"></textarea><br />
            <label for="responseJson">Response:</label><br />
            <textarea name="responseJson" id="responseJson"></textarea>
        </div>
    </form>
</body>
</html>
