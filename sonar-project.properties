sonar.projectKey=developer-training

# Exclude TextbookCode projects from analysis.
# These are reference implementations from the textbook, not production code,
# and generating scan findings for them would add noise without actionable value.
#
# Note: "TextbookCode" is embedded in the directory name (e.g. CSharp.Ch07.TextbookCode.SimpleApp),
# not a path segment of its own, so the pattern must use *TextbookCode* rather than /TextbookCode/.
sonar.exclusions=**/*TextbookCode*/**
sonar.coverage.exclusions=**/*TextbookCode*/**
