name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write

jobs:
  security_scan_windows:
    uses: databankimx/actions/.github/workflows/sonarqube-windows-net4.yml@main
    secrets: inherit

  security_scan_snyk:
    uses: databankimx/actions/.github/workflows/snyk-windows.yml@main
    secrets: inherit
