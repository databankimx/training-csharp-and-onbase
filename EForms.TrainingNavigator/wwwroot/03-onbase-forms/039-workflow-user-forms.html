<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Workflow User Forms</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="images/Icon_Blue.ico">
        <link rel="stylesheet" href="styles/lessons.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
            var useData = false;
            var pageName = "uf";
        </script>
        <script src="scripts/lessons.js"></script>
        <style>
            body {
                font-family: Helvetica, Arial, sans-serif;
                background-color: #f4f6f9;
                color: #1b2733;
                padding: 24px;
            }
            .lesson {
                max-width: 500px;
                margin: 0 auto;
            }
            section {
                background-color: #ffffff;
                border: 1px solid #e1e6ec;
                border-radius: 10px;
                padding: 20px 24px;
                margin-bottom: 20px;
            }
                section h2 {
                    margin: 0 0 12px;
                    font-size: 13px;
                    font-weight: bold;
                    color: #5b6b7a;
                    text-transform: uppercase;
                    letter-spacing: 0.4px;
                }
            .field-row label {
                display: block;
                font-size: 13px;
                font-weight: bold;
                margin-bottom: 5px;
            }
            .field-row input[type="text"] {
                width: 100%;
                font-size: 14px;
                font-family: inherit;
                padding: 7px 9px;
                border: 1px solid #e1e6ec;
                border-radius: 6px;
                box-sizing: border-box;
            }
            .field-row input:focus {
                outline: none;
                border-color: #427dff;
            }
            .form-actions {
                display: flex;
                gap: 10px;
            }
            input[type="submit"] {
                font-weight: bold;
                color: #ffffff;
                background-color: #427dff;
                border: none;
                border-radius: 6px;
                padding: 9px 18px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #2f64d9;
            }
            input[name="OBBtn_No"] {
                color: #1b2733;
                background-color: #e9edf2;
            }
            input[name="OBBtn_No"]:hover {
                background-color: #dbe6ff;
            }
        </style>
    </head>
    <body>
        <div class="lesson">
            <form id="testForm" method="post">
                <h1>Workflow User Forms</h1>

                <section>
                    <h2>Setting Workflow Properties</h2><br>
                    <!--
                        The main addition (besides the ability to include standard keywords) for workflow user forms
                        is the ability to set workflow properties.

                        - Syntax: name="OB_WFPROPERTY_[property name]_#" (where # is the instance number)

                        - When the form is loaded, it will display the current value for the named property
                        - When the form is submitted, the named property will be stored
                        * This functionality uses the Session Property Bag
                    -->
                    <div class="field-row">
                        <label for="wfPropFileType">WF Property - File Type</label>
                        <input type="text" name="OB_WFPROPERTY_fileType_1" id="wfPropFileType">
                    </div>
                </section>

                <div class="form-actions">
                    <!-- Our convention is to use OBBtn_Yes for workflow user forms -->
                    <input type="submit" name="OBBtn_Yes" id="btnSubmit" value="Submit">
                    <!--
                        Our convention is typically to use OBBtn_No for workflow user forms
                        - If you want the task to abort, remember to change this to OBBtn_Cancel
                    -->
                    <input type="submit" name="OBBtn_No" id="btnCancel" value="Cancel">
                </div>

                <input type="reset" name="btnReset" id="btnReset" style="display: none">
            </form>
        </div>

        <div id="data-modal">
            <div class="modal-header">
                <span id="modal-close">x</span>
            </div>
            <div class="modal-body">
                <code id="data-content"></code>
            </div>
        </div>
    </body>
</html>
