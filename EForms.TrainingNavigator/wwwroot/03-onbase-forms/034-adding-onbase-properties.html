<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Adding OnBase Properties</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="../images/Icon_Blue.ico">
        <link rel="stylesheet" href="styles/lessons.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
        <script>
            var useData = false;
            var pageName = "op";
        </script>
        <script src="scripts/lessons.js"></script>
        <style>
            body {
                font-family: Helvetica, Arial, sans-serif;
                background-color: #f4f6f9;
                color: #1b2733;
                padding: 24px;
            }
            .lesson {
                max-width: 550px;
                margin: 0 auto;
            }
            .intro {
                font-size: 13px;
                color: #5b6b7a;
                margin-bottom: 16px;
                background-color: lightgoldenrodyellow;
            }
            section {
                background-color: #ffffff;
                border: 1px solid #e1e6ec;
                border-radius: 10px;
                padding: 20px 24px;
                margin-bottom: 20px;
            }
            section h2 {
                margin: 0 0 14px;
                font-size: 13px;
                font-weight: bold;
                color: #5b6b7a;
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }
            .field-row {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 10px;
            }
            .field-row:last-child {
                margin-bottom: 0;
            }
            .field-row label {
                flex: 0 0 160px;
                font-size: 13px;
                font-weight: bold;
            }
            .field-row input[type="text"] {
                flex: 1;
                font-size: 14px;
                font-family: inherit;
                padding: 7px 9px;
                border: 1px solid #e1e6ec;
                border-radius: 6px;
                box-sizing: border-box;
            }
            .field-row input:focus {
                outline: none;
                border-color: #427dff;
            }
            input[type="submit"] {
                font-weight: bold;
                color: #ffffff;
                background-color: #427dff;
                border: none;
                border-radius: 6px;
                padding: 9px 18px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #2f64d9;
            }
        </style>
    </head>
    <body>
        <div class="lesson">
            <section class="intro">
                <h2>Caution</h2>
                <p>
                    Many OnBase properties can be added to a form using the pattern "OBProperty_PROPERTYNAME". In a real-world
                    scenario, you would probably set readonly="readonly" on all of these.
                </p>
            </section>

            <form id="testForm" method="post">
                <h1>Adding OnBase Properties</h1>

                <section>
                    <h2>Session Properties</h2>
                    <div class="field-row">
                        <label for="propSessionId">Session ID</label>
                        <input type="text" id="propSessionId" name="OBProperty_CurrentSessionID">
                    </div>
                    <div class="field-row">
                        <label for="propLocale">Culture/Locale</label>
                        <input type="text" id="propLocale" name="OBProperty_CurrentUserLocale">
                    </div>
                </section>

                <section>
                    <h2>Document Properties</h2>
                    <div class="field-row">
                        <label for="propDocDate">Document Date</label>
                        <input type="text" id="propDocDate" name="OBProperty_DocumentDate">
                    </div>
                    <div class="field-row">
                        <label for="propDocId">Document Handle</label>
                        <input type="text" id="propDocId" name="OBProperty_ItemNum">
                    </div>
                    <div class="field-row">
                        <label for="propDateStored">Date Stored</label>
                        <input type="text" id="propDateStored" name="OBProperty_DateStored">
                    </div>
                    <div class="field-row">
                        <label for="propTimeStored">Time Stored</label>
                        <input type="text" id="propTimeStored" name="OBProperty_TimeStored">
                    </div>
                    <div class="field-row">
                        <label for="propAuthor">Author</label>
                        <input type="text" id="propAuthor" name="OBProperty_UserName">
                    </div>
                    <div class="field-row">
                        <label for="propRevComment">Revision Comment</label>
                        <input type="text" id="propRevComment" name="OBRevisionComment">
                    </div>
                </section>

                <section>
                    <h2>User Properties</h2>
                    <div class="field-row">
                        <label for="propUserId">User ID</label>
                        <input type="text" id="propUserId" name="OBProperty_CurrentUserID">
                    </div>
                    <div class="field-row">
                        <label for="propUserName">User Name</label>
                        <input type="text" id="propUserName" name="OBProperty_CurrentUserName">
                    </div>
                    <div class="field-row">
                        <label for="propUserRealName">User Real Name</label>
                        <input type="text" id="propUserRealName" name="OBProperty_CurrentUserRealName">
                    </div>
                    <div class="field-row">
                        <label for="propUserDisplayName">User Display Name</label>
                        <input type="text" id="propUserDisplayName" name="OBProperty_CurrentUserDisplayName">
                    </div>
                    <div class="field-row">
                        <label for="propUserEmail">User Email</label>
                        <input type="text" id="propUserEmail" name="OBProperty_CurrentUserEmailAddress">
                    </div>
                    <div class="field-row">
                        <label for="propUserGroupIds">User Group IDs</label>
                        <input type="text" id="propUserGroupIds" name="OBProperty_CurrentUserGroupIDs">
                    </div>
                    <div class="field-row">
                        <label for="propUserGroupNames">User Group Names</label>
                        <input type="text" id="propUserGroupNames" name="OBProperty_CurrentUserGroupNames">
                    </div>
                </section>

                <input type="submit" id="btnSubmit" name="OBBtn_Save" value="SAVE">
            </form>
        </div>

        <div id="data-modal">
            <div class="modal-header">
                <span id="modal-close">x</span>
            </div>
            <div class="modal-body">
                <code id="data-content"></code>
            </div>
        </div>
    </body>
</html>
