    <body>
        <div class="lesson">
            <section>
                <h3>Accounting Notes</h3>
                <label for="notes">Enter notes below:</label>
                <textarea name="notes" id="notes" maxlength="250" readonly="readonly"></textarea>
                <div class="button-row">
                    <button type="button" id="btnAddNote">Add Note</button>
                    <button type="button" id="btnClearNotes" class="secondary">Clear Notes</button>
                </div>
            </section>
        </div>

        <div id="note-modal">
            <h3>New Note</h3>
            <input type="text" name="noteText" id="noteText" maxlength="100" placeholder="Type a note...">
            <div class="button-row">
                <button type="button" id="btnAddNoteText">Add Note</button>
                <button type="button" id="btnCancelNoteText" class="secondary">Cancel</button>
            </div>
        </div>
    </body>
