    <body>
        <div class="container">
            <form method="POST" action="#" class="form-group">
                <div class="row text-center bold">
                    <div class="col-sm-12"><h3>Murphy&apos;s Law Form</h3></div>
                </div>
                <div class="row">
                    <div class="col-sm-2"><label for="kwFormNumber">Form Number:</label></div>
                    <div class="col-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-hash"></i></span>
                            <input type="text" class="form-control" name="OBKey__430_1" id="kwFormNumber" readonly="readonly" placeholder="form number" tabindex="1" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-2"><label for="kwLawId">Law ID:</label></div>
                    <div class="col-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-tag"></i></span>
                            <input type="text" class="form-control" name="OBKey__192_1" placeholder="law id" id="kwLawId" tabindex="2" />
                            <input class="hidden" type="submit" name="OBBtn_ExpandKS107" id="btnAutofill" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-2"><label for="kwLawName">Law Name:</label></div>
                    <div class="col-sm-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                            <input type="text" class="form-control" name="OBKey__190_1" placeholder="law name" id="kwLawName" tabindex="3" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-2"><label for="kwLawText">Law Text:</label></div>
                    <div class="col-sm-10"><textarea class="form-control" name="OBKey__191_1" placeholder="law text content" id="kwLawText" tabindex="4"></textarea></div>
                </div>
                <div class="row">
                    <div class="col-sm-12 text-center">
                        <button name="btnSave" id="btnSave" class="buttons btn btn-labeled btn-success" data-target="btnHidSave" tabindex="5">
                            <span class="btn-label"><i class="fa fa-floppy-disk"></i></span>Save
                        </button>
                        <input class="invisible" type="submit" name="OBBtn_Save" id="btnHidSave" value="Save" />
                        <span class="spacer">&nbsp;</span>
                        <button name="btnCancel" id="btnCancel" class="buttons btn btn-labeled btn-danger" data-target="btnHidCancel" tabindex="6">
                            <span class="btn-label"><i class="fa fa-rectangle-xmark"></i></span>Cancel
                        </button>
                        <input class="invisible" type="submit" name="OBBtn_Cancel" id="btnHidCancel" value="Cancel" />
                    </div>
                </div>
            </form>
        </div>
