    <body>
        <!-- The 'container' class provides a floating viewer area for the Bootstrap form -->
        <div class="container">
            <form method="POST" action="#" class="form-group">
                <!-- The 'row' class groups a row of elements together for responsive rendering -->
                <div class="row text-center bold">
                    <!--
                    The 'col-<type>-<col-span>' classes establish the proportions of the columns
                    Types include sm, md, lg, etc.
                        Spans in any row must total to exactly 12
                    -->
                    <div class="col-sm-12"><h3>Murphy's Law Form</h3></div>
                </div>
                <div class="row">
                    <div class="col-sm-3"><label for="kwFormNumber">Form Number:</label></div>
                    <div class="col-sm-9 input-group">
                        <div class="input-group-addon">
                            <span class="glyphicon glyphicon-certificate"></span>
                        </div>
                        <input type="text" class="form-control" name="OBKey__430_1" id="kwFormNumber" readonly="readonly" tabindex="1"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3"><label for="kwLawId">Law ID:</label></div>
                    <div class="col-sm-9 input-group">
                        <div class="input-group-addon">
                            <label for="kwLawId" class="glyphicon glyphicon-tag"></label>
                        </div>
                        <!-- The 'form-control' class applies the standard formatting for Bootstrap (based on input type) -->
                        <input type="text" class="form-control" name="OBKey__192_1" id="kwLawId" tabindex="2" />
                        <input class="hidden" type="submit" name="OBBtn_ExpandKS107" id="btnAutofill" />
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3"><label for="kwLawName">Law Name:</label></div>
                    <div class="col-sm-9 input-group">
                        <div class="input-group-addon">
                            <label for="kwLawName" class="glyphicon glyphicon-briefcase"></label>
                        </div>
                        <input type="text" class="form-control" name="OBKey__190_1" id="kwLawName" tabindex="3" />
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3"><label for="kwLawText">Law Text:</label></div>
                    <div class="col-sm-9"><textarea class="form-control" name="OBKey__191_1" id="kwLawText" tabindex="4"></textarea></div>
                </div>
                <div class="row">
                    <div class="col-sm-3">&nbsp;</div>
                    <div class="col-sm-9 text-center">
                        <button class="buttons btn btn-success" name="btnSave" id="btnSave" data-target="btnHidSave">
                            <span class="glyphicon glyphicon-floppy-disk" aria-hidden="true"></span>&nbsp;&nbsp;Save
                        </button>
                        <input class="invisible" type="submit" name="OBBtn_Save" id="btnHidSave" value="Save" tabindex="5" />
                        <button class="buttons btn btn-danger" name="btnCancel" id="btnCancel" data-target="btnHidCancel">
                            <span class="glyphicon glyphicon-floppy-remove" aria-hidden="true"></span>&nbsp;&nbsp;Cancel
                        </button>
                        <input class="invisible" type="submit" name="OBBtn_Cancel" id="btnHidCancel" value="Cancel" tabindex="6" />
                    </div>
                </div>
            </form>
        </div>
    </body>
