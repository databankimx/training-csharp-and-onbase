<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <title>Adding a Favicon</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="images/Icon_Blue.ico">
        <link rel="stylesheet" href="styles/lessons.css">
        <style>
            body {
                font-family: Helvetica, sans-serif;
            }
            a:link,
            a:visited {
                color: #0000aa;
            }
            a:hover,
            a:active {
                color: #cc0000;
                text-decoration: none;
            }
        </style>
    </head>
    <body>

        <!-- The icon link creates the favorites icon (or favicon) that shows in favorites and on the browser tab. -->
        <p>Look at the tab displaying the page to see the icon.</p>

    </body>
</html>
