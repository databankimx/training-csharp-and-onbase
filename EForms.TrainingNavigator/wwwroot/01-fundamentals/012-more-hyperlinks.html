<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <title>Implementing Hyperlinks</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/lessons.css">
        <style>
            body {
                font-family: Helvetica, sans-serif;
            }
            a:link,
            a:visited {
                color: #0000aa;
            }
            a:hover,
            a:active {
                color: #cc0000;
                text-decoration: none;
            }
            a.button {
                color: #eeeeee;
                text-decoration: none;
                padding: 5px;
            }
            a.button:link,
            a.button:visited {
                background-color: #0000aa;
                border: 1px solid #000066;
            }
            a.button:hover,
            a.button:active {
                background-color: #cc0000;
                border: 1px solid #660000;
            }
        </style>
    </head>
    <body>

        <p>
            Using an image as a hyperlink:
            <br>
            <a href="https://www.databankimx.com" target="_blank">
                <img height="50" src="../images/Icon_Blue.svg" alt="https://www.databankimx.com" title="DataBank IMX Website">
            </a>
        </p>

        <p>
            Email Hyperlinks:
            <br>
            <a href="mailto:development@databankimx.com">Email Link</a>
            <br>
            <a href="mailto:development@databankimx.com?cc=smclean@databankimx.com">Email Link with CC</a>
            <br>
            <a href="mailto:development@databankimx.com?subject=E-Form%20Training">Email Link with Subject</a>
            <br>
            <a href="mailto:development@databankimx.com?subject=E-Form%20Training&body=Hello!">
                Email Link with Subject and Body
            </a>
            <br>
        </p>

        <p>
            Using a button (and a little JavaScript) as a hyperlink:
            <br>
            <button onclick="window.location='https://www.databankimx.com';">DataBank IMX Website</button>
        </p>

        <p>
            With some styling, you can make a link look and act like a button.
            <br>
            <br>
            <a class="button" href="https://www.databankimx.com" target="_blank">DataBank Website</a>
        </p>

    </body>
</html>
