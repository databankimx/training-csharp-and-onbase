<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <title>Formatting Text</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/lessons.css">
    </head>
    <body style="font-family: Helvetica, sans-serif">

        <!-- There are some specific tags for text formatting. In most cases, however, it is preferable to use CSS instead of these. -->

        Here is
        <b>Bold Text</b>
        <br>
        <br>

        Here is
        <strong>Strong Text</strong>
        <br>
        <br>

        Here is
        <i>Italic Text</i>
        <br>
        <br>

        Here is
        <em>Emphasized Text</em>
        <br>
        <br>

        Here is
        <small>Small Text</small>
        <br>
        <br>

        Here is
        <mark>Marked Text</mark>
        <br>
        <br>

        Here is
        <del>Deleted Text</del>
        <br>
        <br>

        Here is
        <ins>Inserted Text</ins>
        <br>
        <br>

        Here is
        <sub>Subscript Text</sub>
        <br>
        <br>

        Here is
        <sup>Superscript Text</sup>
        <br>

    </body>
</html>
