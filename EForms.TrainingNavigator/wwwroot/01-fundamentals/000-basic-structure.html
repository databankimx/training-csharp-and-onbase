<!DOCTYPE html>
<!-- The !DOCTYPE tag tells the browser what version of HTML to use -->

<!--
    Since we're using them, these tags are comments (which are not rendered by the browser)
-->

<!-- The <html> ... </html> block is the entirety of the page the browser should interpret -->
<html lang="en-us">
    <!-- The <head> ... </head> block is not displayed to the user -->
    <!-- Special sections like scripts and styles should always be placed here -->
    <head>
        <!-- In well-formed HTML5, the title and meta(charset) tags are required -->
        <meta charset="utf-8">
        <title>Basic Structure</title>
        <!-- And the viewport meta tag is strongly recommended -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- All <style> and <script> tags should also be in the head -->
        <link rel="stylesheet" href="styles/lessons.css">
    </head>

    <!-- The <body> ... </body> block is the portion of the page to be displayed to the user -->
    <body>

        <!-- In general, tags take the following forms -->

        <!-- Container tags -->
        <!-- <tagname attribute1="value1" ...>Content</tagname> -->
        <p>Content to display goes here</p>

        <!-- Object or empty tags -->
        <!-- <tagname attribute1="value1" ...> -->
        <hr>

    </body>
</html>
