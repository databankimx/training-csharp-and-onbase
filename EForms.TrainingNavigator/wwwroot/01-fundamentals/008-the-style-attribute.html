<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <title>Using the &quot;style&quot; Attribute</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/lessons.css">
        <style>
            /*
                Page-level polish only - the inline style attribute on the body tag below is
                the lesson's own subject matter and is left exactly as it was, colors and all.
                This block just gives the page some breathing room around it.
            */
            body {
                padding: 24px;
                max-width: 700px;
                margin: 0 auto;
                box-sizing: border-box;
            }
            h1,
            p {
                margin: 0 0 16px;
            }
        </style>
    </head>
    <!-- Using the style attribute, we can determine how the content of a tag block is displayed -->
    <body style="font-family: Arial; background-color: aliceblue">

        <h1 style="color: tomato">Colored Text</h1>

        <p style="background-color: lightgoldenrodyellow">Colored Background</p>

        <p style="font-family: Helvetica, sans-serif; font-size: 36pt; text-align: center">Centered Big Text</p>

    </body>
</html>
