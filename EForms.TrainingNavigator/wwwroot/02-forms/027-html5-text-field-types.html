<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HTML 5 Text Field Types</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../images/Icon_Blue.ico">
    <link rel="stylesheet" href="styles/lessons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
    <script src="scripts/lessons.js"></script>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1b2733;
            padding: 24px;
        }

        .lesson {
            max-width: 500px;
            margin: 0 auto;
        }

        .intro {
            font-size: 13px;
            color: #5b6b7a;
            margin-bottom: 16px;
        }

        section {
            background-color: #ffffff;
            border: 1px solid #e1e6ec;
            border-radius: 10px;
            padding: 20px 24px;
        }

        .field-row {
            margin-bottom: 14px;
        }

            .field-row:last-child {
                margin-bottom: 0;
            }

            .field-row label {
                display: block;
                font-size: 13px;
                font-weight: bold;
                color: #1b2733;
                margin-bottom: 5px;
            }

        input {
            width: 100%;
            font-size: 14px;
            font-family: inherit;
            padding: 8px 10px;
            border: 1px solid #e1e6ec;
            border-radius: 6px;
            box-sizing: border-box;
        }

            input[type="color"] {
                padding: 3px;
                height: 36px;
                width: 60px;
            }

            input[type="range"] {
                padding: 0;
                border: none;
            }

            input:focus {
                outline: none;
                border-color: #427dff;
            }

            input[type="submit"] {
                width: auto;
                font-weight: bold;
                color: #ffffff;
                background-color: #427dff;
                border: none;
                padding: 9px 18px;
                cursor: pointer;
            }

                input[type="submit"]:hover {
                    background-color: #2f64d9;
                }
    </style>
</head>
<body>
    <div class="lesson">
        <p class="intro">
            HTML 5 introduced a number of new input types. These are not supported in all browsers (or in OnBase). When
            unsupported, the browser will render these as type="text".
        </p>

        <section>
            <h1>HTML5 Text Field Types</h1>
            <form id="testForm" method="post">

                <!-- The "multiple" attribute allows entering a comma-delimited list of values -->
                <div class="field-row">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="name@domain.com" multiple="multiple">
                </div>

                <div class="field-row">
                    <label for="search">Search</label>
                    <input type="search" name="search" id="search" placeholder="Search terms..." list="searchSuggestions">
                    <!-- A <datalist> offers suggested values for a paired input, without restricting it to only those values -->
                    <datalist id="searchSuggestions">
                        <option>forms</option>
                        <option>inputs</option>
                        <option>validation</option>
                    </datalist>
                </div>

                <div class="field-row">
                    <label for="tel">Phone</label>
                    <input type="tel" name="tel" id="tel" placeholder="(###) ###-####">
                </div>

                <div class="field-row">
                    <label for="url">URL</label>
                    <input type="url" name="url" id="url" placeholder="https://www.somedomain.com">
                </div>

                <!-- With numeric, range, and date formats, we can implement min, max, and step size -->
                <div class="field-row">
                    <label for="number">Number</label>
                    <input type="number" name="number" id="number" step="any" min="1" max="10">
                </div>

                <div class="field-row">
                    <label for="range">Slider</label>
                    <input type="range" name="range" id="range" step="1" min="0" max="5" list="steplist">
                    <!-- Adding a datalist allows us to display the slider tick-marks (not supported in Firefox) -->
                    <datalist id="steplist">
                        <option>0</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </datalist>
                </div>

                <div class="field-row">
                    <label for="datetime">Date/Time</label>
                    <input type="datetime-local" name="datetime" id="datetime">
                </div>

                <div class="field-row">
                    <label for="date">Date</label>
                    <input type="date" name="date" id="date" min="2026-01-01" max="2026-12-31">
                </div>

                <div class="field-row">
                    <label for="month">Month</label>
                    <input type="month" name="month" id="month">
                </div>

                <div class="field-row">
                    <label for="week">Week</label>
                    <input type="week" name="week" id="week">
                </div>

                <div class="field-row">
                    <label for="time">Time</label>
                    <input type="time" name="time" id="time">
                </div>

                <div class="field-row">
                    <label for="color">Color</label>
                    <input type="color" name="color" id="color">
                </div>

                <div class="field-row">
                    <label for="file">File</label>
                    <input type="file" name="file" id="file">
                </div>

                <input type="submit" name="btnSubmit" id="btnSubmit" value="Submit">
            </form>
        </section>
    </div>
</body>
</html>
