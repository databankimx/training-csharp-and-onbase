<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Radio Buttons &amp; Checkboxes</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="../images/Icon_Blue.ico">
        <link rel="stylesheet" href="styles/lessons.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
        <script src="scripts/lessons.js"></script>
        <style>
            body {
                font-family: Helvetica, Arial, sans-serif;
                background-color: #f4f6f9;
                color: #1b2733;
                padding: 24px;
            }
            .lesson {
                max-width: 500px;
                margin: 0 auto;
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
            }
            fieldset {
                flex: 1 1 200px;
                background-color: #ffffff;
                border: 1px solid #e1e6ec;
                border-radius: 10px;
                padding: 14px 18px;
            }
            legend {
                font-size: 13px;
                font-weight: bold;
                color: #5b6b7a;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                padding: 0 6px;
            }
            .option-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 5px 0;
            }
            .option-row label {
                font-size: 14px;
            }
            input[type="submit"] {
                width: 100%;
                flex-basis: 100%;
                font-weight: bold;
                color: #ffffff;
                background-color: #427dff;
                border: none;
                border-radius: 6px;
                padding: 9px 18px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #2f64d9;
            }
        </style>
    </head>
    <body>
        <form id="testForm" method="post" class="lesson">

            <!-- The <fieldset> tag allows you to logically group inputs together on the page. -->
            <fieldset>
                <legend>Checkboxes</legend>
                <!-- You can select multiple checkboxes, so they require unique names as well as IDs. -->
                <!-- Because the user cannot enter information, all checkboxes and radio buttons require values. -->

                <div class="option-row">
                    <input type="checkbox" name="cb_1" id="cb_1" value="1">
                    <label for="cb_1">Option 1</label>
                </div>
                <!-- You can specify which are selected using the "checked" attribute. -->
                <div class="option-row">
                    <input type="checkbox" name="cb_2" id="cb_2" value="2" checked="checked">
                    <label for="cb_2">Option 2</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Radio Buttons</legend>
                <!-- You can select only one radio button in a group, so they require identical names but unique IDs. -->

                <div class="option-row">
                    <input type="radio" name="rad" id="rad_1" value="1">
                    <label for="rad_1">Option 1</label>
                </div>
                <!-- You can specify which is selected using the "checked" attribute. -->
                <div class="option-row">
                    <input type="radio" name="rad" id="rad_2" value="2" checked="checked">
                    <label for="rad_2">Option 2</label>
                </div>
            </fieldset>

            <input type="submit" name="btnSubmit" id="btnSubmit" value="Submit">
        </form>
    </body>
</html>
