<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Basic HTML Form Structure</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="../images/Icon_Blue.ico">
        <link rel="stylesheet" href="styles/lessons.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
        <script>
            var useData = false;
            var pageName = "basic";
        </script>
        <script src="scripts/lessons.js"></script>
        <style>
            body {
                font-family: Helvetica, Arial, sans-serif;
                background-color: #f4f6f9;
                color: #1b2733;
                padding: 24px;
            }
            .lesson {
                max-width: 500px;
                margin: 0 auto;
            }
            section {
                background-color: #ffffff;
                border: 1px solid #e1e6ec;
                border-radius: 10px;
                padding: 20px 24px;
            }
            label {
                display: block;
                font-size: 13px;
                font-weight: bold;
                color: #5b6b7a;
                margin-bottom: 6px;
            }
            input[type="text"] {
                width: 100%;
                font-size: 14px;
                font-family: inherit;
                padding: 8px 10px;
                border: 1px solid #e1e6ec;
                border-radius: 6px;
                margin-bottom: 16px;
            }
            input[type="text"]:focus {
                outline: none;
                border-color: #427dff;
            }
            input[type="submit"] {
                font-size: 14px;
                font-weight: bold;
                color: #ffffff;
                background-color: #427dff;
                border: none;
                border-radius: 6px;
                padding: 9px 18px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #2f64d9;
            }
        </style>
    </head>
    <body>
        <div class="lesson">
            <section>
                <h1>A Basic HTML Form</h1>
                <form id="testForm" method="post">

                    <!-- An <input> tag is the basic element of user data to be sent from the form. -->
                    <label for="tstInput">Test Input</label>
                    <input type="text" name="tstInput" id="tstInput">

                    <!-- An input tag of type submit is required in order to send the form to the server. -->
                    <input type="submit" name="btnSubmit" id="btnSubmit" value="Submit">

                </form>

            </section>
        </div>
    </body>
</html>
