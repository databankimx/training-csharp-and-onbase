<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Select Lists</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../images/Icon_Blue.ico">
    <link rel="stylesheet" href="styles/lessons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts/lessons.js"></script>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1b2733;
            padding: 24px;
        }

        .lesson {
            max-width: 500px;
            margin: 0 auto;
        }

        section {
            background-color: #ffffff;
            border: 1px solid #e1e6ec;
            border-radius: 10px;
            padding: 20px 24px;
        }

        .field-row {
            margin-bottom: 18px;
        }

            .field-row:last-child {
                margin-bottom: 0;
            }

            .field-row label {
                display: block;
                font-size: 13px;
                font-weight: bold;
                color: #1b2733;
                margin-bottom: 5px;
            }

        select,
        input[type="text"] {
            width: 100%;
            font-size: 14px;
            font-family: inherit;
            padding: 8px 10px;
            border: 1px solid #e1e6ec;
            border-radius: 6px;
            box-sizing: border-box;
        }

            select:focus,
            input:focus {
                outline: none;
                border-color: #427dff;
            }

        input[type="submit"] {
            font-weight: bold;
            color: #ffffff;
            background-color: #427dff;
            border: none;
            border-radius: 6px;
            padding: 9px 18px;
            cursor: pointer;
            margin-top: 4px;
        }

            input[type="submit"]:hover {
                background-color: #2f64d9;
            }
    </style>
</head>
<body>
    <div class="lesson">
        <section>
            <h1>HTML Select Lists</h1>
            <form id="testForm" method="post">

                <!-- The <select> tag is used to create a drop-down list of values. -->
                <div class="field-row">
                    <label for="select">Select List</label>
                    <!-- The "selected" attribute indicates which option is selected when the form loads. -->
                    <select id="select" name="select">
                        <option value="1">One</option>
                        <option value="2" selected="selected">Two</option>
                        <option value="3">Three</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="grouped">Grouped Select List</label>
                    <!-- The "size" attribute indicates how many options display at once. -->
                    <select id="grouped" name="grouped" size="6">
                        <!-- The <optgroup> tag allows you to logically group the selections in a <select> list. -->
                        <optgroup label="Odd Numbers">
                            <option value="1" selected="selected">One</option>
                            <option value="3">Three</option>
                        </optgroup>
                        <optgroup label="Even Numbers">
                            <option value="2">Two</option>
                            <option value="4">Four</option>
                        </optgroup>
                    </select>
                </div>

                <div class="field-row">
                    <label for="list">Data List</label>
                    <!-- A <datalist> extends list selection to text fields and filters as the user types. -->
                    <datalist id="options">
                        <!-- When the displayed and passed values are the same, the "value" attribute is optional. -->
                        <option>One</option>
                        <option>Two</option>
                        <option>Three</option>
                    </datalist>
                    <!-- The "list" attribute identifies the datalist used by the text field. -->
                    <input type="text" name="list" id="list" list="options">
                </div>

                <input type="submit" name="btnSubmit" id="btnSubmit" value="Submit">
            </form>
        </section>
    </div>
</body>
</html>
