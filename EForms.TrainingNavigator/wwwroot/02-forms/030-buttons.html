<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Form Buttons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/Icon_Blue.ico">
    <link rel="stylesheet" href="styles/lessons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts/lessons.js"></script>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1b2733;
            padding: 24px;
        }

        .lesson {
            max-width: 500px;
            margin: 0 auto;
        }

        section {
            background-color: #ffffff;
            border: 1px solid #e1e6ec;
            border-radius: 10px;
            padding: 20px 24px;
        }

        .btn-row {
            margin-bottom: 12px;
        }

            .btn-row:last-child {
                margin-bottom: 0;
            }

        button,
        input[type="button"],
        input[type="reset"],
        input[type="submit"] {
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            color: #1b2733;
            background-color: #e9edf2;
            border: 1px solid #d7dee6;
            border-radius: 6px;
            padding: 9px 18px;
            cursor: pointer;
        }

            button:hover,
            input[type="button"]:hover,
            input[type="reset"]:hover,
            input[type="submit"]:hover {
                border-color: #427dff;
                background-color: #dbe6ff;
            }
    </style>
    <script>
        $(document).ready(function () {
            $("button, input[type=button], input[type=submit], input[type=reset]").on("click", function () {
                var tag = $(this).prop("nodeName").toLowerCase();
                var type = tag == "button" ? "n/a" : $(this).prop("type");
                var id = $(this).prop("id");
                var message =
                    "You clicked a" + (tag === "button" ? "" : "n") + " " + tag + " with\ntype = " + type + "\nid = " + id;
                log(message);
                return false;
            });
        });
    </script>
</head>
<body>
    <div class="lesson">
        <section>
            <h1>HTML Form Buttons</h1>
            <form id="testForm" method="post">
                <h2>Form Buttons</h2>

                <!-- The <button> tag provides a button not tied to any input element. -->
                <p class="btn-row"><button name="btnButton" id="btnButton">BUTTON</button></p>

                <!-- An input with type="button" provides a button that is included in the form data. -->
                <p class="btn-row"><input type="button" id="btnInpButton" name="btnInpButton" value="INPUT BUTTON"></p>

                <!-- An input with type="reset" provides a button that clears the form back to its default values when it loaded. -->
                <p class="btn-row"><input type="reset" id="btnReset" name="btnReset" value="RESET"></p>

                <!-- An input with type="submit" provides a button that submits the form to its "action" URL. -->
                <p class="btn-row"><input type="submit" id="btnSubmit" name="btnSubmit" value="SUBMIT"></p>

                <!-- A form can have a second (or more) submit button that overrides the default values of the form. -->
                <p class="btn-row">
                    <input type="submit" id="btnSubmit2" name="btnSubmit2" value="SUBMIT 2" formmethod="get" formaction="#">
                </p>
            </form>
        </section>
    </div>
</body>
</html>
