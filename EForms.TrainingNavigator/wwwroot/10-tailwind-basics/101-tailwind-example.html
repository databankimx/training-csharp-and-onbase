    <body class="bg-slate-100 py-6">
        <div class="max-w-4xl mx-auto px-4">
            <form method="POST" action="#" class="space-y-3">
                <div class="text-center font-bold">
                    <h3 class="text-xl">Murphy&apos;s Law Form</h3>
                </div>
                <div class="grid grid-cols-12 gap-2 items-center">
                    <div class="col-span-12 sm:col-span-2"><label for="kwFormNumber">Form Number:</label></div>
                    <div class="col-span-12 sm:col-span-10">
                        <div class="flex">
                            <span class="inline-flex items-center px-3 bg-slate-200 border border-r-0 border-slate-300 rounded-l"><i class="fa fa-hashtag"></i></span>
                            <input type="text" class="flex-1 min-w-0 px-3 py-2 border border-slate-300 rounded-r bg-slate-50" name="OBKey__430_1" id="kwFormNumber" readonly="readonly" placeholder="form number" />
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-2 items-center">
                    <div class="col-span-12 sm:col-span-2"><label for="kwLawId">Law ID:</label></div>
                    <div class="col-span-12 sm:col-span-10">
                        <div class="flex">
                            <span class="inline-flex items-center px-3 bg-slate-200 border border-r-0 border-slate-300 rounded-l"><i class="fa fa-tag"></i></span>
                            <input type="text" class="flex-1 min-w-0 px-3 py-2 border border-slate-300 rounded-r" name="OBKey__192_1" placeholder="law id" id="kwLawId" />
                            <input class="hidden" type="submit" name="OBBtn_ExpandKS107" id="btnAutofill" />
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-2 items-center">
                    <div class="col-span-12 sm:col-span-2"><label for="kwLawName">Law Name:</label></div>
                    <div class="col-span-12 sm:col-span-10">
                        <div class="flex">
                            <span class="inline-flex items-center px-3 bg-slate-200 border border-r-0 border-slate-300 rounded-l"><i class="fa fa-briefcase"></i></span>
                            <input type="text" class="flex-1 min-w-0 px-3 py-2 border border-slate-300 rounded-r" name="OBKey__190_1" placeholder="law name" id="kwLawName" />
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-2 items-start">
                    <div class="col-span-12 sm:col-span-2"><label for="kwLawText">Law Text:</label></div>
                    <div class="col-span-12 sm:col-span-10"><textarea class="w-full px-3 py-2 border border-slate-300 rounded" name="OBKey__191_1" placeholder="law text content" id="kwLawText"></textarea></div>
                </div>
                <div class="text-center">
                    <button name="btnSave" id="btnSave" class="buttons inline-flex items-center gap-2 px-4 py-2 rounded bg-green-600 hover:bg-green-700 text-white" data-target="btnHidSave">
                        <i class="fa fa-floppy-disk"></i>Save
                    </button>
                    <input class="hidden" type="submit" name="OBBtn_Save" id="btnHidSave" value="Save" />
                    <span class="inline-block w-12">&nbsp;</span>
                    <button name="btnCancel" id="btnCancel" class="buttons inline-flex items-center gap-2 px-4 py-2 rounded bg-red-600 hover:bg-red-700 text-white" data-target="btnHidCancel">
                        <i class="fa fa-rectangle-xmark"></i>Cancel
                    </button>
                    <input class="hidden" type="submit" name="OBBtn_Cancel" id="btnHidCancel" value="Cancel" />
                </div>
            </form>
        </div>
    </body>
