    <body>
        <div class="lesson">
            <section>
                <h3>Screen Saver Demo</h3>
                <p>
                    Move your mouse anywhere over this page and the screen saver stays off. Stop moving it, and once
                    the delay below runs out, a bouncing DataBank icon takes over - moving your mouse again stops it
                    immediately.
                </p>
                <div class="control-row">
                    <label for="delaySlider">Delay before screen saver: <span id="delayValue">30</span> seconds</label>
                    <input type="range" id="delaySlider" min="5" max="60" step="5" value="30">
                </div>
                <div id="countdown" class="status"></div>
            </section>
        </div>
