    <body>
        <div class="lesson">

            <section>
                <h3>Your Saved Name</h3>
                <p>
                    Type a name and save it - it's stored as a cookie, so it'll still be there if you close this tab and
                    come back (until it expires, or you clear it below).
                </p>
                <div class="status" id="cookieStatus">Checking for a saved cookie...</div>
                <div class="demo-row">
                    <input type="text" id="nameInput" placeholder="Enter a name">
                    <button type="button" id="btnSetCookie">Save Name</button>
                    <button type="button" id="btnClearCookie" class="secondary">Clear Cookie</button>
                </div>
            </section>
